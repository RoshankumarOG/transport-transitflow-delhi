<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A simpler way through Delhi. Compare bus and metro journeys, track options, and plan faster.">
<title>TransitFlow - Find your way through Delhi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--ink:#183c37;--muted:#687b74;--green:#235e4b;--lime:#d9ed9b;--paper:#f7f8f2;--line:#dfe5dc;--card:#ffffff;--shadow:0 12px 32px rgba(24,60,55,.08);--radius:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.hero{padding:30px 0;grid-template-columns:1fr}.hero h1{font-size:40px;margin:10px 0;letter-spacing:-.03em}.hero p{max-width:680px;margin:0 auto;color:var(--muted);font-size:18px}

.examples{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 18px}.examples>span{font-size:13px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<header><nav class="nav" aria-label="Main navigation"><a class="brand" href="/" aria-label="TransitFlow homepage"><b>transitflow</b></a></nav></header>
<main class="wrap">
<section id="planner"><div class="section-top"><div><h1 style="font-size:clamp(32px,4vw,48px);letter-spacing:-.03em;margin:0 0 8px">Delhi Transit Planner</h1><p>Compare bus and metro paths across the capital network.</p></div></div>
<div class="examples"><span>Try a journey</span><div class="presets"><button class="preset" data-from="362" data-to="2084">Connaught Place → Hauz Khas</button><button class="preset" data-from="757" data-to="1451">Dwarka Sec 21 → Noida City Centre</button></div></div>

<section class="results" id="results" tabindex="-1" hidden aria-label="Journey results"><h3 id="resultsTitle">Option details</h3><div class="result-cards" id="resultCards"></div></section>
<details id="dataInfo"><summary>Where does the data come from?</summary><p id="networkInfo">Loading data stats...</p></details></section>
</main><footer><div class="wrap footer-inner"><span><b>transitflow</b> / A better way through Delhi</span></div></footer>
<script src="/planner.js"></script>
<style>
#inv-cursor {
  position: fixed;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #fff;
  mix-blend-mode: difference;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.15s;
}
</style>
<div id="inv-cursor"></div>
<script>
document.addEventListener('mousemove', function(e) {
  var el = document.getElementById('inv-cursor');
  if (el) {
    el.style.left = e.clientX + 'px';
    el.style.top = e.clientY + 'px';
    el.style.opacity = '1';
  }
});
document.addEventListener('mouseleave', function() {
  var el = document.getElementById('inv-cursor');
  if (el) el.style.opacity = '0';
});
</script>
</body>
</html>
